name: Build & Release APK

# LightQR-style CI: auto-builds an APK on every push to main and publishes it
# as a GitHub Release. Obtainium watches this repo's releases. No EAS account
# needed — `expo prebuild` + plain Gradle on the runner.

on:
  push:
    branches: [ main ]
    paths-ignore:
      - '**.md'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Compute version
        id: ver
        run: |
          BASE=$(node -p "require('./app.json').expo.version")
          echo "name=${BASE}.${{ github.run_number }}" >> "$GITHUB_OUTPUT"

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install dependencies
        run: bun install

      - name: Typecheck
        run: bunx tsc --noEmit

      - name: Stamp version into app.json
        run: |
          node -e "
            const fs = require('fs');
            const j = JSON.parse(fs.readFileSync('app.json', 'utf8'));
            j.expo.version = '${{ steps.ver.outputs.name }}';
            j.expo.android.versionCode = ${{ github.run_number }};
            fs.writeFileSync('app.json', JSON.stringify(j, null, 2));
          "

      - name: Prebuild android project
        run: bunx expo prebuild --platform android --no-install

      - name: Autolinking forensics
        run: |
          echo "--- settings.gradle expoAutolinking lines ---"
          grep -n "expoAutolinking" android/settings.gradle || true
          echo "--- modules dir ---"
          ls modules/recorder || true
          echo "--- resolve from repo root ---"
          node node_modules/expo-modules-autolinking/bin/expo-modules-autolinking.js resolve -p android -j 2>/dev/null | head -c 400 || true
          echo ""
          node node_modules/expo-modules-autolinking/bin/expo-modules-autolinking.js resolve -p android -j 2>/dev/null | grep -o '"packageName":"[^"]*"' || true

      - name: Build release APK
        working-directory: android
        run: ./gradlew :app:assembleRelease -PreactNativeArchitectures=arm64-v8a --no-daemon

      - name: Rename APK
        run: |
          cp android/app/build/outputs/apk/release/app-release.apk \
             LightFog-v${{ steps.ver.outputs.name }}.apk

      # What changed, from CHANGELOG.md, so a release says something. The top section is whatever
      # sits between the first `## ` heading and the next one — nothing to remember at release time
      # beyond writing the changelog entry with the change itself.
      - name: Release notes from CHANGELOG
        id: notes
        run: |
          {
            echo 'body<<CHANGELOG_EOF'
            awk '/^## /{n++} n==1' CHANGELOG.md || true
            echo ''
            echo '---'
            echo ''
            echo '**Install / update via Obtainium** — point it at this repo:'
            echo '`https://github.com/gi-os/LightFog`'
            echo ''
            echo 'Or sideload with ADB:'
            echo '`adb install -r LightFog-v${{ steps.ver.outputs.name }}.apk`'
            echo 'CHANGELOG_EOF'
          } >> "$GITHUB_OUTPUT"

      - name: Publish Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.ver.outputs.name }}
          name: LightFog v${{ steps.ver.outputs.name }}
          body: ${{ steps.notes.outputs.body }}
          files: LightFog-v${{ steps.ver.outputs.name }}.apk

      # Tell the index a release exists instead of waiting for its cron. GitHub
      # schedules are best-effort -- observed 70 minutes apart against a 15
      # minute schedule -- so without this a new release can sit uncatalogued
      # for over an hour and simply not appear as an update.
      - name: Ping the index
        if: success()
        continue-on-error: true
        run: |
          curl -sf -X POST \
            -H "Authorization: Bearer ${{ secrets.INDEX_DISPATCH_TOKEN }}" \
            -H "Accept: application/vnd.github+json" \
            https://api.github.com/repos/gi-os/brightmarket-index/dispatches \
            -d "{\"event_type\":\"app-released\"}" \
          || echo "index ping failed; the hourly cron will pick this up"
