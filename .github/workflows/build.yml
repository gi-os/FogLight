name: Verify APK build

# Verification only: builds exactly what release.yml builds and publishes nothing.
#
# This used to call EAS, which needs an EXPO_TOKEN this repo doesn't set, so it
# failed on every run and no branch could be checked before it became a release.
# release.yml only triggers on main and publishes when it passes, which meant the
# first real build of a change was also the release of it. Same steps here, minus
# the publish, dispatchable on any branch.

on:
  workflow_dispatch:
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install dependencies
        run: bun install

      - name: Typecheck
        run: bunx tsc --noEmit

      - name: Prebuild android project
        run: bunx expo prebuild --platform android --no-install

      # The manifest merge is where a foreground-service permission goes missing, and a
      # missing one is a SecurityException at startForeground rather than a build failure —
      # so it is worth asserting here, where it costs nothing, instead of at 7am.
      - name: Assert foreground-service permissions survived the merge
        run: |
          M=android/app/src/main/AndroidManifest.xml
          for p in FOREGROUND_SERVICE FOREGROUND_SERVICE_LOCATION ACCESS_FINE_LOCATION; do
            grep -q "android.permission.$p" "$M" \
              || { echo "::error::$p missing from the merged manifest"; exit 1; }
          done
          grep -q 'foregroundServiceType="location"' "$M" \
            || echo "::warning::RecorderService is not typed location in the merged manifest"

      - name: Build release APK
        working-directory: android
        run: ./gradlew :app:assembleRelease -PreactNativeArchitectures=arm64-v8a --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: LightFog-unreleased-apk
          path: android/app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
