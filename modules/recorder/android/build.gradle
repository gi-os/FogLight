plugins {
  id 'com.android.library'
  id 'expo-module-gradle-plugin'
}

android {
  namespace "expo.modules.recorder"
  defaultConfig {
    versionCode 1
    versionName "0.1.0"
  }
}

dependencies {
  // Stays.kt is deliberately free of Android imports so the clustering can be checked without a
  // device — which is where its mistakes live, not in the provider that serves it.
  testImplementation 'junit:junit:4.13.2'
}
