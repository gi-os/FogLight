plugins {
  id 'com.android.library'
  id 'expo-module-gradle-plugin'
}

android {
  namespace "expo.modules.recorder"
  defaultConfig {
    versionCode 1
    versionName "0.1.0"
  }
}

dependencies {
  // The hourly weather refresh rides WorkManager's batch windows instead of owning an alarm —
  // the whole point is that it can never wake the phone on its own.
  implementation 'androidx.work:work-runtime-ktx:2.9.1'

  // Stays.kt and Weather.kt are deliberately free of Android imports so the clustering and the
  // fetch discipline can be checked without a device — which is where their mistakes live, not
  // in the providers that serve them.
  testImplementation 'junit:junit:4.13.2'
}
